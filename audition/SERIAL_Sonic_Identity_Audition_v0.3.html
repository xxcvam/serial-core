<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>SERIAL · Sonic Identity Audition v0.3</title>
<style>
  :root{--bg:#0b0d10;--fg:#d8dde3;--dim:#6d7681;--hot:#ff5a3c;--on:#59c3a7;--line:#1d232a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:14px 18px 6px}
  h1{font-size:14px;font-weight:600;letter-spacing:.14em;margin:0 0 2px;color:#fff}
  .sub{color:var(--dim);font-size:11px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
  button{background:#141a21;color:var(--fg);border:1px solid #2a323c;border-radius:4px;padding:6px 11px;font:inherit;cursor:pointer}
  button:hover{border-color:#3c4653}
  button.on{background:var(--on);color:#06231c;border-color:var(--on)}
  button.hot{background:var(--hot);color:#2a0b04;border-color:var(--hot)}
  .grp{display:flex;gap:4px;align-items:center}
  .grp .tag{color:var(--dim);font-size:10px;letter-spacing:.12em;margin-right:2px}
  input{background:#141a21;border:1px solid #2a323c;border-radius:4px;color:var(--fg);padding:6px 9px;font:inherit;width:170px;letter-spacing:.08em}
  #grid{padding:12px 18px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .lbl{width:58px;color:var(--dim);font-size:10px;letter-spacing:.1em}
  .cells{display:flex;gap:3px}
  .c{width:26px;height:15px;border-radius:2px;background:#161c23;border:1px solid #1f262e}
  .c.beat{background:#1b2229}
  .c.hit{background:#3a4750}
  .c.on2.hit{background:#4a5f52}
  .c.cur{outline:1px solid #93a2b0;outline-offset:1px}
  #formbar{display:flex;gap:4px;padding:0 18px 10px}
  .seg{flex:1;text-align:center;padding:4px 0;font-size:10px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line);border-radius:3px}
  .seg.act{color:#06231c;background:var(--on);border-color:var(--on)}
  #state{padding:0 18px 8px;color:var(--dim);font-size:11px}
  #state b{color:var(--fg);font-weight:500}
  footer{padding:10px 18px 22px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);margin-top:8px}
  footer li{margin:2px 0}
</style>
</head>
<body>
<header>
  <h1>SERIAL · SONIC IDENTITY AUDITION v0.3</h1>
  <div class="sub">合并版 · 不是最终音乐内核 · Bass 为唯一音色基准，其余为候选</div>
</header>

<div class="bar">
  <div class="grp"><span class="tag">SEED</span><input id="seed" value="A7F209C13B8ED614" spellcheck="false"></div>
  <button id="play">PLAY</button>
  <button id="stop">STOP</button>
  <button id="crack" class="hot">CRACK</button>
  <div class="grp"><span class="tag">SOUND</span>
    <button id="tone-v03">v0.3 合并</button><button id="tone-v02">v0.2 参照</button>
  </div>
  <div class="grp"><span class="tag">COMP</span>
    <button id="comp-A">A 旋转动机</button><button id="comp-B">B 轮廓动机</button>
  </div>
  <div class="grp"><span class="tag">SOLO</span><button id="solo-all">ALL</button></div>
  <div class="grp" id="solo-voices"></div>
</div>

<div id="state">—</div>
<div class="bar" id="readout"><span class="tag">NOW</span><b id="sec">—</b><span id="bar"></span><span id="tick"></span></div>
<div id="formbar"></div>
<div id="grid"></div>

<footer>
  <ul>
    <li>Sound A/B：固定 Seed、PAT、Form、BPM、总线增益，只换合成参数。</li>
    <li>Comp A/B：固定合成与混音，只换动机生成规则（A 八分旋转动机 / B 十六分轮廓动机）。</li>
    <li>CRACK 按住破坏、松开恢复；三段脉冲，非 PCM stutter/freeze。</li>
    <li>Bass 为 v0.1 原始实现，两套 SOUND 共用以作为基准。</li>
  </ul>
</footer>

<script>
/* ============================================================
   0. 工具
   ============================================================ */
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const hz=(root,semi)=>root*Math.pow(2,semi/12);

/* ============================================================
   1. SHA-256 —— 标准大端输出
   ============================================================ */
const SHA256=(()=>{
  const K=new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  return function(msg){
    const l=msg.length;
    const total=((l+9+63)>>6)<<6;
    const buf=new Uint8Array(total); buf.set(msg); buf[l]=0x80;
    const dv0=new DataView(buf.buffer);
    dv0.setUint32(total-8,Math.floor(l/536870912),false);
    dv0.setUint32(total-4,(l*8)>>>0,false);
    let H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
                           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    const w=new Uint32Array(64);
    for(let off=0;off<total;off+=64){
      for(let i=0;i<16;i++) w[i]=dv0.getUint32(off+i*4,false);
      for(let i=16;i<64;i++){
        const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
        const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
      }
      let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(let i=0;i<64;i++){
        const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
        const ch=(e&f)^(~e&g);
        const t1=(h+S1+ch+K[i]+w[i])|0;
        const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
        const maj=(a&b)^(a&c)^(b&c);
        const t2=(S0+maj)|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    /* 标准摘要：每个 32-bit 字按大端写出，跨平台一致 */
    const out=new Uint8Array(32), ov=new DataView(out.buffer);
    for(let i=0;i<8;i++) ov.setUint32(i*4,H[i]>>>0,false);
    return out;
  };
})();

/* ============================================================
   2. PCG32 + 48 字节定长寻址键（SERIALM/0.2）
   ============================================================ */
const MUL=6364136223846793005n, MASK=(1n<<64n)-1n;
const MAGIC=[..."SERIALM/0.2"].map(c=>c.charCodeAt(0)); MAGIC.push(0);
const DOMAIN={music:1,visual:2,card:3};
const PURPOSE={gate:1,pitch:2,velocity:3,duration:4,probability:5,timbre:6,eventId:7,mutation:8};

/* 显式声部身份：不再用可变变量 activeTrack 传递 */
const TRACK_ID=Object.freeze({kick:1,snare:2,hat:3,bass:4,arp:5,lead:6,glitch:7});

function pcgNext(s){
  const old=s.state;
  s.state=(old*MUL+s.inc)&MASK;
  const x=Number((((old>>18n)^old)>>27n)&0xFFFFFFFFn);
  const rot=Number(old>>59n)&31;
  return ((x>>>rot)|(x<<((-rot)&31)))>>>0;
}
function pcgSeed(initstate,initseq){
  /* 增量在内部统一为奇数，initseq 不再预先 |1 */
  const s={state:0n,inc:((initseq<<1n)|1n)&MASK};
  pcgNext(s);
  s.state=(s.state+initstate)&MASK;
  pcgNext(s);
  return s;
}

function encodeKey(k){
  const b=new Uint8Array(48);
  b.set(MAGIC,0);
  const dv=new DataView(b.buffer);
  dv.setBigUint64(12,k.seed,true);
  dv.setUint16(20,k.generatorVersion,true);
  dv.setUint8(22,k.domain);
  dv.setUint16(23,k.trackId,true);
  dv.setUint16(25,k.sectionId,true);
  dv.setUint32(27,k.localBar,true);
  dv.setBigUint64(31,BigInt(k.tick),true);
  dv.setUint8(39,k.purpose);
  dv.setUint32(40,k.attempt,true);
  dv.setUint32(44,0,true);
  return b;
}

function R32(seed,trackId,sectionId,localBar,tick,purpose,attempt=0,domain=DOMAIN.music){
  const d=SHA256(encodeKey({seed,generatorVersion:1,domain,trackId,sectionId,localBar,tick,purpose,attempt}));
  const dv=new DataView(d.buffer,d.byteOffset,32);
  /* initstate / initseq 均按大端读取，与 TS / C++ 保持一致 */
  const st=pcgSeed(dv.getBigUint64(0,false),dv.getBigUint64(8,false));
  return pcgNext(st);
}
function randomFor(track,sectionId,bar,tick,purpose,attempt=0){
  return R32(SEED,TRACK_ID[track],sectionId,bar,tick,purpose,attempt);
}

/* ============================================================
   3. 时间与 Form
   ============================================================ */
const PPQ=96, TICKS_PER_BAR=PPQ*4, STEP_TICKS=24, STEPS=16, BPM=140;
const stepDur=()=>(60/BPM)/4;

const FORM=[
  {id:0,name:'INTRO', bars:2, density:70,  cutoff:1300, tracks:{kick:0,bass:0,arp:1,snare:0,hat:0,lead:0,glitch:0}},
  {id:1,name:'GROOVE',bars:2, density:88,  cutoff:2100, tracks:{kick:1,bass:1,arp:1,snare:1,hat:1,lead:0,glitch:0}},
  {id:2,name:'RISE',  bars:2, density:92,  cutoff:2600, tracks:{kick:1,bass:1,arp:1,snare:1,hat:1,lead:1,glitch:0}},
  {id:3,name:'CLIMAX',bars:2, density:100, cutoff:3400, tracks:{kick:1,bass:1,arp:1,snare:1,hat:1,lead:1,glitch:1}},
  {id:4,name:'BREAK', bars:1, density:55,  cutoff:900,  tracks:{kick:0,bass:0,arp:1,snare:0,hat:0,lead:0,glitch:1}},
  {id:5,name:'RETURN',bars:2, density:92,  cutoff:2900, tracks:{kick:1,bass:1,arp:1,snare:1,hat:1,lead:1,glitch:0}}
];
const PLAY_ORDER=[0,1,2,3,4,5];

/* ============================================================
   4. 音域分工（起始配置，非硬限制）
   Bass A1–G2 / Arp A3–G4 / Lead A4–E5
   ============================================================ */
const BASS_ROOT=55,   BASS_MOV=[0,0,0,3,5,7,10];        // 55 … 98 Hz
const ARP_ROOT=220,   AM7=[0,3,7,10];                   // 220 … 392 Hz（八度锁定）
const LEAD_ROOT=440,  LEAD_SCALE=[0,2,3,5,7];           // 440 … 659 Hz

/* ============================================================
   5. 节奏骨架
   ============================================================ */
function euclid(n,k){
  const p=new Uint8Array(n); let bucket=0;
  for(let i=0;i<n;i++){
    bucket+=k;
    if(bucket>=n){ bucket-=n; p[(i+1)%n]=1; }
  }
  return p;
}
const EU={
  kick:euclid(16,4),
  snare:(()=>{const a=new Uint8Array(16); a[4]=1; a[12]=1; return a;})(),
  hat:euclid(16,8),
  bass:euclid(16,5),
  arp:euclid(16,12),
  lead:euclid(16,3)
};

/* ============================================================
   6. 动机库
   ============================================================ */
const ARP_MOTIF=[0,1,2,1,3,2,1,0];                 // COMP A：八分旋转
const ARP_CONTOUR=[                                // COMP B：十六分轮廓
  [0,1,2,3,0,1,2,3],
  [3,2,1,0,3,2,1,0],
  [0,1,2,3,2,1,0,1],
  [0,0,1,0,0,2,0,3]
];
const LEAD_PHRASES=[[0,2,4,3],[4,3,2,0],[0,1,4,2]];

/* ============================================================
   7. 生成：一次 Seed → 整张 PAT
   ============================================================ */
let SEED=BigInt('0x'+document.getElementById('seed').value);
let TONE='v03';        // Sound A/B
let COMP='A';          // Comp A/B
const PAT=[];

function build(){
  PAT.length=0;
  for(const sec of FORM){
    const bars=[];
    for(let bar=0;bar<sec.bars;bar++){
      const steps=[];
      for(let st=0;st<STEPS;st++){
        const tick=st*STEP_TICKS;
        const ev={};
        const R=(tr,pu,at=0)=>randomFor(tr,sec.id,bar,tick,pu,at);

        if(sec.tracks.kick && EU.kick[st])
          ev.kick=0.85+(R('kick',PURPOSE.velocity)%30)/100;

        if(sec.tracks.snare && EU.snare[st])
          ev.snare=0.5+(R('snare',PURPOSE.velocity)%30)/100;

        if(sec.tracks.hat && EU.hat[st] && (R('hat',PURPOSE.gate)%100)<78)
          ev.hat={v:(st%4===2?0.34:0.2)+(R('hat',PURPOSE.velocity)%20)/100, open:(st%8===6)};

        if(sec.tracks.bass && EU.bass[st]){
          const g=R('bass',PURPOSE.gate);
          if((g%100)<sec.density){
            const deg=R('bass',PURPOSE.pitch)%BASS_MOV.length;
            ev.bass={
              f:hz(BASS_ROOT,BASS_MOV[deg]),
              v:0.55+(R('bass',PURPOSE.velocity)%25)/100,
              len:(st%2===0)?2.2:1.4
            };
          }
        }

        if(sec.tracks.arp){
          if(COMP==='A'){
            if(st%2===0 && (R('arp',PURPOSE.gate)%100)<96){
              const rot=randomFor('arp',sec.id,0,0,PURPOSE.mutation)%8;
              const idx=ARP_MOTIF[(Math.floor(st/2)+rot)%8];
              ev.arp={ f:hz(ARP_ROOT,AM7[idx]),
                       v:0.16+(R('arp',PURPOSE.velocity)%28)/100, cut:sec.cutoff };
            }
          }else{
            if(EU.arp[st] && (R('arp',PURPOSE.gate)%100)<92){
              const ci=ARP_CONTOUR[randomFor('arp',sec.id,0,0,PURPOSE.mutation)%ARP_CONTOUR.length];
              const idx=ci[st%8];
              ev.arp={ f:hz(ARP_ROOT,AM7[idx]),
                       v:0.16+(R('arp',PURPOSE.velocity)%28)/100, cut:sec.cutoff };
            }
          }
        }

        if(sec.tracks.lead && EU.lead[st]){
          const g=R('lead',PURPOSE.gate);
          if((g%100)<sec.density){
            /* localBar=0：同一 Section 共享同一主题动机，这是有意的 */
            const pi=randomFor('lead',sec.id,0,0,PURPOSE.mutation)%LEAD_PHRASES.length;
            const ph=LEAD_PHRASES[pi];
            const idx=ph[(bar*3+Math.floor(st/4))%ph.length];
            ev.lead={ f:hz(LEAD_ROOT,LEAD_SCALE[idx%LEAD_SCALE.length]),
                      v:0.3+(R('lead',PURPOSE.velocity)%28)/100,
                      len:2.6+(R('lead',PURPOSE.duration)%3)*1.3, cut:sec.cutoff };
          }
        }

        if(sec.tracks.glitch && (R('glitch',PURPOSE.gate)%100)<(sec.id===4?38:12))
          ev.glitch={ v:0.22+(R('glitch',PURPOSE.velocity)%30)/100,
                      rate:0.5+(R('glitch',PURPOSE.timbre)%22)/10 };

        steps.push(ev);
      }
      bars.push(steps);
    }
    PAT[sec.id]=bars;
  }
}

/* ============================================================
   8. 音频图
   ============================================================ */
let ctx=null,master,comp,toneLP,drumBus,bassBus,arpBus,leadBus,fxBus,delay,verb,noiseBuf;
const MASTER_LEVEL=0.72;

function initAudio(){
  if(ctx) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=0;
  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12; comp.knee.value=12; comp.ratio.value=3.2;
  comp.attack.value=0.004; comp.release.value=0.16;
  toneLP=ctx.createBiquadFilter(); toneLP.type='lowpass'; toneLP.frequency.value=20000; toneLP.Q.value=0.7;
  master.connect(comp).connect(toneLP).connect(ctx.destination);

  drumBus=ctx.createGain(); drumBus.gain.value=0.9; drumBus.connect(master);
  bassBus=ctx.createGain(); bassBus.gain.value=0.55; bassBus.connect(master);
  arpBus =ctx.createGain(); arpBus.gain.value=0.34; arpBus.connect(master);
  leadBus=ctx.createGain(); leadBus.gain.value=0.28; leadBus.connect(master);

  delay=ctx.createDelay(1.0); delay.delayTime.value=(60/BPM)*(3/4);
  const fb=ctx.createGain(); fb.gain.value=0.23;
  const dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2600;
  delay.connect(dlp).connect(fb).connect(delay);
  delay.connect(master);

  verb=ctx.createConvolver();
  const len=Math.floor(ctx.sampleRate*1.7);
  const ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.1);
  }
  verb.buffer=ir;
  const vg=ctx.createGain(); vg.gain.value=0.13;
  verb.connect(vg).connect(master);

  arpBus.connect(delay); leadBus.connect(delay);
  leadBus.connect(verb); arpBus.connect(verb);
  fxBus=ctx.createGain(); fxBus.gain.value=0.5; fxBus.connect(master); fxBus.connect(delay);

  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
}

function noise(t,dur){
  const s=ctx.createBufferSource(); s.buffer=noiseBuf;
  s.loop=true; s.start(t); s.stop(t+dur); return s;
}

/* ============================================================
   9. v0.3 合成器（合并决议）
   ============================================================ */
function vKick(t,v){
  /* 双段 Pitch Envelope：165 → 62(18ms) → 47(65ms) */
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(165,t);
  o.frequency.exponentialRampToValueAtTime(62,t+0.018);
  o.frequency.exponentialRampToValueAtTime(47,t+0.065);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v*0.85),t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
  o.connect(g).connect(drumBus); o.start(t); o.stop(t+0.315);

  /* Click 取中间值 v*0.2，HP 3600，10ms */
  const n=noise(t,0.014),hp=ctx.createBiquadFilter(),ng=ctx.createGain();
  hp.type='highpass'; hp.frequency.value=3600;
  ng.gain.setValueAtTime(v*0.2,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.010);
  n.connect(hp).connect(ng).connect(drumBus);
}

function vSnare(t,v){
  /* body */
  const body=ctx.createOscillator(),bg=ctx.createGain();
  body.type='triangle';
  body.frequency.setValueAtTime(190,t);
  body.frequency.exponentialRampToValueAtTime(133,t+0.047);
  bg.gain.setValueAtTime(v*0.38,t);
  bg.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  body.connect(bg).connect(drumBus); body.start(t); body.stop(t+0.095);

  /* 噪声：HP → BP 串联 */
  const n=noise(t,0.18),hp=ctx.createBiquadFilter(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();
  hp.type='highpass'; hp.frequency.value=850;
  bp.type='bandpass'; bp.frequency.value=2350; bp.Q.value=0.5;
  ng.gain.setValueAtTime(v*0.44,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  n.connect(hp).connect(bp).connect(ng).connect(drumBus);

  /* 保留第二层高频噪声作为军鼓亮度 */
  const n2=noise(t,0.05),hp2=ctx.createBiquadFilter(),ng2=ctx.createGain();
  hp2.type='highpass'; hp2.frequency.value=5200;
  ng2.gain.setValueAtTime(v*0.18,t);
  ng2.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
  n2.connect(hp2).connect(ng2).connect(drumBus);
}

function vHat(t,v,open){
  const d=open?0.19:0.045;
  const n=noise(t,d+0.04),hp=ctx.createBiquadFilter(),ng=ctx.createGain();
  hp.type='highpass'; hp.frequency.value=open?6200:6700;
  ng.gain.setValueAtTime(v*0.45,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+d);
  n.connect(hp).connect(ng).connect(drumBus);

  /* 不谐和振荡器：不是纯白噪声，接近合成金属打击乐 */
  const metal=ctx.createGain(),mhp=ctx.createBiquadFilter();
  metal.gain.setValueAtTime(v*(open?0.055:0.04),t);
  metal.gain.exponentialRampToValueAtTime(0.0001,t+d+0.007);
  mhp.type='highpass'; mhp.frequency.value=5800;
  metal.connect(mhp).connect(drumBus);
  [421,632,777].forEach(f=>{
    const o=ctx.createOscillator(); o.type='square'; o.frequency.value=f;
    o.connect(metal); o.start(t); o.stop(t+d+0.012);
  });
}

/* Bass：v0.1 原始实现，固定滤波包络，两套 SOUND 共用 */
function vBass(t,f,v,len){
  const o=ctx.createOscillator(),o2=ctx.createOscillator();
  const lp=ctx.createBiquadFilter(),g=ctx.createGain();
  o.type='sawtooth'; o.frequency.value=f;
  o2.type='square';  o2.frequency.value=f/2;
  lp.type='lowpass'; lp.Q.value=7;
  const hold=stepDur()*len;
  lp.frequency.setValueAtTime(190,t);
  lp.frequency.linearRampToValueAtTime(720,t+0.02);
  lp.frequency.exponentialRampToValueAtTime(160,t+Math.max(0.08,hold*0.6));
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+0.004);
  g.gain.setValueAtTime(v*0.85,t+hold*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,t+hold);
  const o2g=ctx.createGain(); o2g.gain.value=0.5;
  o.connect(lp); o2.connect(o2g).connect(lp);
  lp.connect(g).connect(bassBus);
  o.start(t); o2.start(t); o.stop(t+hold+0.02); o2.stop(t+hold+0.02);
}

function vArp(t,f,v,cut){
  const o=ctx.createOscillator(),harm=ctx.createOscillator();
  const g=ctx.createGain(),lp=ctx.createBiquadFilter(),hg=ctx.createGain();
  o.type='triangle'; o.frequency.value=f;
  harm.type='square'; harm.frequency.value=f*2;
  hg.gain.value=0.12;
  lp.type='lowpass'; lp.frequency.value=clamp(cut,850,2600); lp.Q.value=0.65;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v*0.7),t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.145);
  o.connect(lp); harm.connect(hg).connect(lp);
  lp.connect(g).connect(arpBus);
  o.start(t); harm.start(t); o.stop(t+0.15); harm.stop(t+0.15);
}

function vLead(t,f,v,len,cut){
  const hold=stepDur()*len;
  const mix=ctx.createGain(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  mix.gain.value=1;
  const peak=clamp(cut,1150,3800);
  lp.type='lowpass'; lp.Q.value=0.6;
  lp.frequency.setValueAtTime(Math.max(700,peak*0.4),t);
  lp.frequency.exponentialRampToValueAtTime(peak,t+0.085);
  lp.frequency.exponentialRampToValueAtTime(Math.max(900,peak*0.45),t+hold+0.16);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v*0.9),t+0.017);
  g.gain.setValueAtTime(Math.max(0.0002,v*0.65),t+hold*0.75);
  g.gain.exponentialRampToValueAtTime(0.0001,t+hold+0.18);
  /* 三支锯齿归一化 */
  [-7,0,7].forEach(det=>{
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.type='sawtooth';
    o.frequency.value=f*Math.pow(2,det/1200);
    og.gain.value=1/3;
    o.connect(og).connect(mix);
    o.start(t); o.stop(t+hold+0.20);
  });
  /* Sub 进入同一 mix（即同一 Filter 与 Envelope），不再绕过低通 */
  const sub=ctx.createOscillator(),sg=ctx.createGain();
  sub.type='sine'; sub.frequency.value=f/2; sg.gain.value=0.22;
  sub.connect(sg).connect(mix);
  sub.start(t); sub.stop(t+hold+0.20);
  mix.connect(lp).connect(g).connect(leadBus);
}

function vGlitch(t,v,rate){
  /* 三段脉冲；不是 PCM stutter / freeze */
  const n=noise(t,0.16),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  bp.type='bandpass'; bp.Q.value=9;
  bp.frequency.setValueAtTime(400+rate*900,t);
  bp.frequency.exponentialRampToValueAtTime(90,t+0.12);
  g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  n.connect(bp).connect(g).connect(fxBus);
  for(let i=0;i<3;i++){
    const st=t+0.018*i,gg=ctx.createGain(),nn=noise(st,0.028),hp=ctx.createBiquadFilter();
    hp.type='highpass'; hp.frequency.value=1600;
    gg.gain.setValueAtTime(v*0.4,st);
    gg.gain.exponentialRampToValueAtTime(0.0001,st+0.015);
    nn.connect(hp).connect(gg).connect(fxBus);
  }
}

/* ============================================================
   10. v0.2 参照合成器（Sound A/B 的另一侧；Bass 共用）
   ============================================================ */
function vKick02(t,v){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(168,t);
  o.frequency.exponentialRampToValueAtTime(41,t+0.052);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+0.0015);
  g.gain.exponentialRampToValueAtTime(0.012,t+0.115);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.29);
  o.connect(g).connect(drumBus); o.start(t); o.stop(t+0.31);
  const n=noise(t,0.014),hp=ctx.createBiquadFilter(),ng=ctx.createGain();
  hp.type='highpass'; hp.frequency.value=3200;
  ng.gain.setValueAtTime(v*0.4,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.012);
  n.connect(hp).connect(ng).connect(drumBus);
}
function vSnare02(t,v){
  const n=noise(t,0.18),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  bp.type='bandpass'; bp.frequency.value=1950; bp.Q.value=0.85;
  g.gain.setValueAtTime(v*0.5,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.125);
  n.connect(bp).connect(g).connect(drumBus);
  const n2=noise(t,0.06),hp=ctx.createBiquadFilter(),g2=ctx.createGain();
  hp.type='highpass'; hp.frequency.value=5200;
  g2.gain.setValueAtTime(v*0.22,t);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  n2.connect(hp).connect(g2).connect(drumBus);
  const o=ctx.createOscillator(),og=ctx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(210,t);
  o.frequency.exponentialRampToValueAtTime(140,t+0.055);
  og.gain.setValueAtTime(v*0.26,t);
  og.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
  o.connect(og).connect(drumBus); o.start(t); o.stop(t+0.07);
}
function vHat02(t,v,open){
  const n=noise(t,open?0.22:0.09),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  bp.type='bandpass'; bp.frequency.value=open?9800:11200; bp.Q.value=1.3;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
  g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(open?0.19:0.042));
  n.connect(bp).connect(hp).connect(g).connect(drumBus);
}
function vArp02(t,f,v,cut){
  const g=ctx.createGain(),lp=ctx.createBiquadFilter();
  const o=ctx.createOscillator(),o2=ctx.createOscillator();
  o.type='sawtooth'; o.frequency.value=f;
  o2.type='square';  o2.frequency.value=f*1.005;
  lp.type='lowpass'; lp.Q.value=2.4;
  lp.frequency.setValueAtTime(cut*1.5,t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(500,cut*0.8),t+0.1);
  const o2g=ctx.createGain(); o2g.gain.value=0.18;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.105);
  o.connect(lp); o2.connect(o2g).connect(lp);
  lp.connect(g).connect(arpBus);
  o.start(t); o2.start(t); o.stop(t+0.13); o2.stop(t+0.13);
}
function vLead02(t,f,v,len,cut){
  const g=ctx.createGain(),lp=ctx.createBiquadFilter();
  const hold=stepDur()*len;
  lp.type='lowpass'; lp.Q.value=1.1;
  lp.frequency.setValueAtTime(Math.min(9000,cut*1.6),t);
  lp.frequency.linearRampToValueAtTime(Math.min(9000,cut*2.2),t+0.06);
  lp.frequency.exponentialRampToValueAtTime(Math.max(700,cut*0.7),t+hold);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+0.022);
  g.gain.setValueAtTime(v*0.86,t+hold*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,t+hold+0.18);
  lp.connect(g).connect(leadBus);
  [-9,-3,7].forEach(det=>{
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.type='sawtooth';
    o.frequency.value=f*Math.pow(2,det/1200);
    og.gain.value=1/3;
    o.connect(og).connect(lp);
    o.start(t); o.stop(t+hold+0.2);
  });
  const sub=ctx.createOscillator(),sg=ctx.createGain();
  sub.type='sine'; sub.frequency.value=f/2;
  sg.gain.setValueAtTime(0,t);
  sg.gain.linearRampToValueAtTime(v*0.34,t+0.024);
  sg.gain.setValueAtTime(v*0.28,t+hold*0.7);
  sg.gain.exponentialRampToValueAtTime(0.0001,t+hold+0.16);
  sub.connect(sg).connect(leadBus);
  sub.start(t); sub.stop(t+hold+0.18);
}

/* ============================================================
   11. 调度
   ============================================================ */
let playing=false,nextTime=0,pos={secIdx:0,bar:0,step:0},timer=null;
let uiSec=-1,uiBar=-1,uiStep=-1,crackHeld=false,soloVoice=null;
const audible=n=>soloVoice===null||soloVoice===n;

function scheduleStep(sec,bar,step,time){
  const ev=PAT[sec.id][bar][step];
  if(!ev) return;
  const v03=TONE==='v03';
  if(ev.kick  && audible('kick'))   (v03?vKick:vKick02)(time,ev.kick);
  if(ev.snare && audible('snare'))  (v03?vSnare:vSnare02)(time,ev.snare);
  if(ev.hat   && audible('hat'))    (v03?vHat:vHat02)(time,ev.hat.v,ev.hat.open);
  if(ev.bass  && audible('bass'))   vBass(time,ev.bass.f,ev.bass.v,ev.bass.len);
  if(ev.arp   && audible('arp'))    (v03?vArp:vArp02)(time,ev.arp.f,ev.arp.v,ev.arp.cut);
  if(ev.lead  && audible('lead'))   (v03?vLead:vLead02)(time,ev.lead.f,ev.lead.v,ev.lead.len,ev.lead.cut);
  if(ev.glitch&& audible('glitch')) vGlitch(time,ev.glitch.v,ev.glitch.rate);
  if(crackHeld && audible('glitch')) vGlitch(time+stepDur()*0.5,0.12,1.4);
}

function advance(){
  pos.step++;
  if(pos.step<STEPS) return;
  pos.step=0; pos.bar++;
  const sec=FORM[PLAY_ORDER[pos.secIdx]];
  if(pos.bar<sec.bars) return;
  pos.bar=0; pos.secIdx++;
  if(pos.secIdx>=PLAY_ORDER.length) pos.secIdx=1;
}

function tick(){
  if(!playing) return;
  const horizon=ctx.currentTime+0.12;
  while(nextTime<horizon){
    const sec=FORM[PLAY_ORDER[pos.secIdx]];
    scheduleStep(sec,pos.bar,pos.step,nextTime);
    uiSec=sec.id; uiBar=pos.bar; uiStep=pos.step;
    nextTime+=stepDur();
    advance();
  }
  paint();
}

let painted=-1;
function paint(){
  if(uiSec<0) return;
  const key=uiSec*1000+uiBar*16+uiStep;
  if(painted===key) return;
  painted=key;
  for(const t of TRACKS){
    for(let i=0;i<STEPS;i++){
      const c=cells[t.k][i];
      c.classList.remove('cur','hit','on2');
      const note=PAT[uiSec][uiBar][i];
      if(note&&note[t.k]) c.classList.add('hit');
      if(note&&note[t.k]&&(t.k==='arp'||t.k==='glitch')) c.classList.add('on2');
    }
    cells[t.k][uiStep].classList.add('cur');
  }
  [...formEl.children].forEach(el=>el.classList.toggle('act',+el.dataset.sec===uiSec));
  document.getElementById('sec').textContent=FORM[uiSec].name;
  document.getElementById('bar').textContent=(uiBar+1)+'/'+FORM[uiSec].bars;
  document.getElementById('tick').textContent=(uiStep*STEP_TICKS);
}

document.getElementById('play').onclick=()=>{

/* STOP：淡出 → 挂起上下文，避免残留 Delay / Reverb 干扰 A/B 判断 */

  master.gain.setValueAtTime(master.gain.value,t);

};

/* CRACK：按住破坏、松开恢复 */
const crackBtn=document.getElementById('crack');
function crackDown(e){
  if(e&&e.preventDefault) e.preventDefault();
  initAudio();
  if(ctx.state==='suspended') ctx.resume();
  crackHeld=true;
  const t=ctx.currentTime;
  toneLP.frequency.cancelScheduledValues(t);
  toneLP.frequency.setValueAtTime(toneLP.frequency.value,t);
  toneLP.frequency.exponentialRampToValueAtTime(420,t+0.05);
  crackBtn.classList.add('on');
}
function crackUp(){
  if(!crackHeld) return;
  crackHeld=false;
  if(ctx){
    const t=ctx.currentTime;
    toneLP.frequency.cancelScheduledValues(t);
    toneLP.frequency.setValueAtTime(toneLP.frequency.value,t);
    toneLP.frequency.exponentialRampToValueAtTime(20000,t+0.45);
  }
  crackBtn.classList.remove('on');
}

crackBtn.addEventListener('pointercancel',crackUp);

const GOLDEN_V03={
  version:'SERIAL-RNG/0.3',
  note:'由本实现生成；变更实现必须新增版本号，禁止覆盖 v0.2 / S1-POC1 向量',
  magicSha256Prefix:'23acde19f24107b3',
  vectors:[
    {track:'kick',  section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:800243746},
    {track:'snare', section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:2345530725},
    {track:'hat',   section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:596672106},
    {track:'bass',  section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:3495400725},
    {track:'arp',   section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:387588177},
    {track:'lead',  section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:3780759646},
    {track:'glitch',section:1,bar:0,tick:48,purpose:'gate', attempt:0,value:1812408616},
    {track:'arp',   section:3,bar:1,tick:72,purpose:'pitch',attempt:2,value:627203707}
  ]
};

function selftest(){
  const res=[];
  const push=(n,ok,extra)=>res.push({n,ok:!!ok,extra:extra===undefined?'':String(extra)});

  const enc=new TextEncoder().encode('abc');
  const digest=SHA256(enc);
  const hex=[...digest].map(b=>b.toString(16).padStart(2,'0')).join('');
  push('SHA256("abc") 标准向量',
    hex==='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad', hex);

  const a=R32(SEED,TRACK_ID.arp,1,0,48,PURPOSE.gate,0);
  const b=R32(SEED,TRACK_ID.arp,1,0,48,PURPOSE.gate,0);
  push('R32 确定性',a===b,a);

  const vals=Object.keys(TRACK_ID).map(k=>R32(SEED,TRACK_ID[k],1,0,48,PURPOSE.gate,0));
  push('七声部独立寻址',new Set(vals).size===7,vals.join(','));

  push('键长 48 字节',
    encodeKey({seed:SEED,generatorVersion:1,domain:DOMAIN.music,trackId:1,sectionId:2,localBar:3,tick:24,purpose:4,attempt:0}).length===48);

  const snapshot=JSON.stringify(PAT);
  const compSaved=COMP;
  COMP='A'; build();
  const rebuildA=JSON.stringify(PAT);
  push('同一 Seed 的 PAT 可复现',snapshot===rebuildA);
  COMP='B'; build();
  const rebuildB=JSON.stringify(PAT);
  push('Comp A/B 产生不同 PAT',rebuildA!==rebuildB);
  COMP=compSaved; build();

  const semisOf=f=>12*Math.log2(f/440);
  const arpSet=new Set(), leadSet=new Set(), bassSet=new Set();
  for(const sec of FORM){
    const bars=PAT[sec.id]||[];
    for(const bar of bars) for(const st of bar){
      if(st.arp) arpSet.add(Math.round(semisOf(st.arp.f)));
      if(st.lead) leadSet.add(Math.round(semisOf(st.lead.f)));
      if(st.bass) bassSet.add(Math.round(semisOf(st.bass.f)));
    }
  }
  const arpS=[...arpSet].sort((x,y)=>x-y), leadS=[...leadSet].sort((x,y)=>x-y), bassS=[...bassSet].sort((x,y)=>x-y);
  /* 半音数以 A4=440 为 0：A3=-12、G4=-2；A1=-36、G2=-26；A4=0、E5=+7 */
  push('Arp 区间 A3–G4',arpS.length>0&&arpS[0]>=-12&&arpS[arpS.length-1]<=-2,arpS.join(','));
  push('Lead 区间 A4–E5',leadS.length>0&&leadS[0]>=0&&leadS[leadS.length-1]<=7,leadS.join(','));
  push('Bass 区间 A1–G2',bassS.length>0&&bassS[0]>=-36&&bassS[bassS.length-1]<=-26,bassS.join(','));

  /* Golden Vectors 自校验：表内值必须由当前实现逐一复现 */
  const PU={gate:PURPOSE.gate,pitch:PURPOSE.pitch,velocity:PURPOSE.velocity,duration:PURPOSE.duration,
            probability:PURPOSE.probability,timbre:PURPOSE.timbre,eventId:PURPOSE.eventId,mutation:PURPOSE.mutation};
  let gOK=GOLDEN_V03.vectors.length>0, gBad=[];
  for(const v of GOLDEN_V03.vectors){
    const got=R32(SEED,TRACK_ID[v.track],v.section,v.bar,v.tick,PU[v.purpose],v.attempt);
    if(got!==v.value){ gOK=false; gBad.push(v.track+'@'+v.section+'/'+v.bar+'/'+v.tick+' got '+got+' want '+v.value); }
  }
  push('Golden Vectors '+GOLDEN_V03.version,gOK,gBad.join(' | '));

  return {pass:res.every(r=>r.ok),results:res,
    ranges:{arp:arpS,lead:leadS,bass:bassS},golden:GOLDEN_V03};
}

window.SERIAL={R32,SHA256,TRACK_ID,encodeKey,build,selftest,PAT,FORM,EU,
  get SEED(){return SEED},setSeed(v){SEED=v},get COMP(){return COMP},setCOMP(v){COMP=v;build()}};

refresh();
build();
</script>
